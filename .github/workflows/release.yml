name: Release

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Download the tested archive
        uses: actions/download-artifact@v8.0.2
        with:
          name: npm-package
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          digest-mismatch: error

      - name: Verify the tested archive
        id: package
        run: |
          archive=(artifacts/*.tgz)
          test "${#archive[@]}" -eq 1
          test -f "${archive[0]}"
          sha256sum "${archive[0]}" | diff artifacts/SHA256SUMS -
          tar -xOf "${archive[0]}" package/package.json | node -e '
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            const packed = JSON.parse(fs.readFileSync(0, "utf8"));
            const checkout = require("./package.json");
            assert.equal(packed.name, checkout.name);
            assert.equal(packed.version, checkout.version);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${packed.version}\n`);
          '
          echo "archive=${archive[0]}" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.package.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if version exists on npm
        id: npm_check
        run: |
          if npm view transliteration@${{ steps.package.outputs.version }} version >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update npm for OIDC support
        if: steps.npm_check.outputs.exists == 'false'
        run: npm install -g npm@12.2.1

      - name: Publish to npm
        if: steps.npm_check.outputs.exists == 'false'
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          sha256sum "$ARCHIVE" | diff artifacts/SHA256SUMS -
          npm publish "./$ARCHIVE" --ignore-scripts --provenance

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.package.outputs.version }}" -m "Release v${{ steps.package.outputs.version }}"
          git push origin "v${{ steps.package.outputs.version }}"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: v${{ steps.package.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
